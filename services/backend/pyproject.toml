[project]
name = "infinite-canvas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx[socks]>=0.28,<1", "websockets>=15,<17", "python-multipart>=0.0.20", "requests>=2.32,<3", "requests-toolbelt>=1.0,<2", "pillow>=11,<13", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]
